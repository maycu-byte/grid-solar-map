<head>

<title>Grid Solar Map, Saarland</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --ground: #f4f5f2; --panel: #ffffff; --sunk: #eef0ec; --ink: #1b2320; --ink2: #4b5751; --ink3: #7a857f; --hair: #d9ded9;
    --accent: #c77d0a; --sub: #1f5f8b; --good: #1f7a3a; --bad: #b3261e;
    --r0: #fff6d9; --r1: #fde29a; --r2: #f7b955; --r3: #e58a1f; --r4: #b85c08; --r5: #7a3a03;
    --g0: #e6f0f7; --g1: #bcd6e9; --g2: #86b5d6; --g3: #4f8fbf; --g4: #2567a0; --g5: #0f3f6b;
    --sans: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ground: #121614; --panel: #1b201d; --sunk: #232925; --ink: #e8ece9; --ink2: #b5bfb9; --ink3: #87928c; --hair: #2e3632; --accent: #f0a83a; --sub: #7cb8e0; --good: #5cc07a; --bad: #ef7a70; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font: 15px/1.5 var(--sans); display: grid; grid-template-columns: minmax(360px, 420px) 1fr; }
  @media (max-width: 860px) { body { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } #map { order: -1; min-height: 60vh; } }
  aside { background: var(--panel); border-right: 1px solid var(--hair); padding: 18px 18px 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; max-height: 100vh; }
  @media (max-width: 860px) { aside { max-height: none; } }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  h1 { font-size: 1.45rem; line-height: 1.2; margin: 0; letter-spacing: -.01em; }

  .stat { border: 1px solid var(--hair); border-radius: 8px; padding: 8px 10px; }

  .stat span { font-size: .78rem; color: var(--ink3); }
  select { width: 100%; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--hair); background: var(--panel); color: var(--ink); }

  ol li b { font-family: var(--mono); font-weight: 500; color: var(--ink); }

  #detail td.hi { color: var(--bad); font-weight: 600; }
  #detail td.lo { color: var(--good); }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  .kv b { font-family: var(--mono); font-weight: 500; text-align: right; }

  .sources { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: .86rem; }

  .kind.real { color: var(--good) !important; } .kind.syn { color: var(--accent) !important; }

  #map { height: 100%; min-height: 60vh; }
  .leaflet-tooltip { font: 13px var(--sans); }
  [hidden] { display: none !important; }
</style>

<body>
<aside>
  <div class="top">
    <div><h1 data-t="title">Grid Solar Map</h1></div>
    <div class="seg lang" id="lang-seg" role="group" aria-label="Language"><button data-v="en" aria-pressed="true">EN</button><button data-v="pt" aria-pressed="false">PT</button><button data-v="de" aria-pressed="false">DE</button></div>
  </div>

  <div id="tab-map">

    <section style="margin-top:16px"><h2 data-t="region">Region</h2><div class="stats" id="stats"></div></section>

      <h2 data-t="colourBy">Colour the map by</h2>

      <div class="legend" id="legend"></div>
      <div class="legend-labels"><span id="lmin"></span><span id="lmax"></span></div>
    </section>
    <section style="margin-top:14px" id="rule-box">
      <h2 data-t="rule">Curtailment rule</h2>
